name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Cloudflare serves this file for unknown paths (wrangler.jsonc); fail if the build stops writing it.
      - run: grep -q 'Nothing on this shelf' build/404.html
      # The redirect Worker is deployed by hand, so check it keeps path and query.
      - run: node redirect/check.js
