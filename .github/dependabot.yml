version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0 # paused; remove to resume
    schedule:
      interval: weekly
    # app.css loads two slices of this font by number; a new version may renumber them silently.
    ignore:
      - dependency-name: "@fontsource/zen-kaku-gothic-new"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0 # paused; remove to resume
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
